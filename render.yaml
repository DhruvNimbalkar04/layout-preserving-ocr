services:
  - type: web
    name: layout-preserving-ocr-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn --chdir backend backend.wsgi --log-file -
    healthCheckPath: /api/documents/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SERVE_MEDIA
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_UPLOAD_MAX_FILE_SIZE
        value: "20971520"

  - type: web
    name: layout-preserving-ocr-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
